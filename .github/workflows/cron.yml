# Búsqueda continua en la nube: llama a /api/cron cada 30 minutos.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   APP_URL      la dirección pública de la app (p. ej. https://travelseeker.vercel.app)
#   CRON_SECRET  el mismo valor que la variable CRON_SECRET de Vercel
name: Buscar alertas

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Llamar a /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos APP_URL o CRON_SECRET: no se busca."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
